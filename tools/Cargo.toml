[package]
name = "rvbench-tools"
version.workspace = true
edition.workspace = true

[[bin]]
name = "rvbench-tools"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
regex.workspace = true
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
rvbench-cli = { git = "https://github.com/rvbench/rvbench-cli.git", rev = "77329289baa0e9b30fa039d97b29b630fcae7733" }
rvbench-protocol = { git = "https://github.com/rvbench/rvbench-core-rust.git", rev = "a3891e19f189901c6428bfa98c341bdde4d5a04a" }
tokio.workspace = true
uuid.workspace = true
serde_json.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
